<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>POST /api/games request execution</title>
<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:"Segoe UI",Arial,sans-serif;padding:28px 32px}
.caption{font-size:18px;color:#222;margin:0 0 18px;font-weight:600}
#diagram{width:1500px}
#diagram svg{max-width:100%;height:auto}
</style>
<script src="vendor/mermaid.min.js"></script></head>
<body>
<div class="caption">POST /api/games request execution</div>
<div id="diagram"></div>
<script>
const def = "sequenceDiagram\n  autonumber\n  participant Client as HTTP client\n  participant Router as product.routes.js\n  participant Ctrl as product.controller.js\n  participant Val as product.validation.js\n  participant Svc as product.service.js\n  participant Model as Product (Sequelize)\n  participant DB as PostgreSQL\n\n  Client->>Router: POST /api/games (JSON body)\n  Router->>Ctrl: create(req, res)\n  Ctrl->>Val: validateCreate(req.body)\n  Val->>Val: whitelist + field rules + minBet <= maxBet\n  alt invalid payload\n    Val-->>Ctrl: ValidationError (422)\n    Ctrl-->>Client: errorHandler -> 422 VALIDATION_ERROR\n  else valid payload\n    Val-->>Ctrl: normalized data\n    Ctrl->>Svc: create(data)\n    Svc->>DB: BEGIN, then SELECT game_categories by categoryId\n    DB-->>Svc: category row (or none)\n    Svc->>Model: Product.create(prepared, { fields, transaction })\n    Model->>DB: INSERT INTO products ... RETURNING *\n    DB-->>Model: inserted row\n    Model-->>Svc: Product instance\n    Svc->>DB: COMMIT\n    Svc-->>Ctrl: product\n    Ctrl-->>Client: 201 Created + Location: /api/games/{id}\n  end\n";
mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict',
  fontFamily: 'Segoe UI, Arial, sans-serif',
  flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: true },
  sequence: { useMaxWidth: true }, er: { useMaxWidth: true } });
(async () => {
  const { svg } = await mermaid.render('diagram-svg', def);
  document.getElementById('diagram').innerHTML = svg;
  window.__rendered = true;
  document.title = 'ready';
})().catch((e) => { document.body.innerHTML = '<pre>' + e.stack + '</pre>'; });
</script></body></html>
