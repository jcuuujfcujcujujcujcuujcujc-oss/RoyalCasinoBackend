<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>architecture</title>
<style>
html,body{margin:0;padding:0;background:#ffffff}
body{font-family:"Segoe UI",Arial,sans-serif;padding:0}
#diagram{width:1180px;background:#ffffff}
#diagram svg{display:block;max-width:none;height:auto}
</style>
<script src="./vendor/mermaid.min.js"></script></head>
<body>
<div id="diagram"></div>
<script>
const def = "flowchart TB\n  Client[\"HTTP-клиент<br/>(JSON, REST)\"] --> PHead\n\n  subgraph P[\" \"]\n    PHead[\"Уровень представления\"]\n    PHead --> App[\"src/app.js<br/>Express 5: защитные заголовки,<br/>express.json (100 КБ), маршруты\"]\n    App --> Router[\"src/routes/index.js<br/>/api/games, /api/categories,<br/>/api/players, /api/casino/statistics\"]\n    Router --> Ctrl[\"Контроллеры<br/>разбор id, вызов валидации,<br/>формирование HTTP-ответа\"]\n  end\n\n  Ctrl --> BHead\n\n  subgraph B[\" \"]\n    BHead[\"Уровень бизнес-логики\"]\n    BHead --> Val[\"Валидация<br/>*.validation.js<br/>белый список, типы, диапазоны\"]\n    BHead --> Svc[\"Сервисы<br/>*.service.js<br/>правила, транзакции, блокировки\"]\n  end\n\n  Svc --> DHead\n\n  subgraph D[\" \"]\n    DHead[\"Уровень доступа к данным\"]\n    DHead --> Model[\"Модели Sequelize<br/>Product, GameCategory,<br/>Player, PlayerCreditProfile\"]\n    DHead --> SQL[\"statistics.queries.js<br/>статические SQL-запросы\"]\n    Model --> DB[(\"PostgreSQL 15.15\")]\n    SQL --> DB\n  end\n\n  Val -. \"AppError\" .-> EH[\"src/middleware/errorHandler.js<br/>единое отображение ошибок<br/>в коды 400–503\"]\n  Svc -. \"ошибки Sequelize\" .-> EH\n";
mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict',
  fontFamily: 'Segoe UI, Arial, sans-serif', fontSize: 16,
  flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: false },
  sequence: { useMaxWidth: false, wrap: false },
  er: { useMaxWidth: false, minEntityWidth: 130, entityPadding: 14 } });
(async () => {
  const { svg } = await mermaid.render('diagram-svg', def);
  document.getElementById('diagram').innerHTML = svg;
  window.__rendered = true;
  document.title = 'ready';
})().catch((e) => { document.body.innerHTML = '<pre>' + e.stack + '</pre>'; document.title = 'error'; });
</script></body></html>
