<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>module-anatomy</title>
<style>
html,body{margin:0;padding:0;background:#ffffff}
body{font-family:"Segoe UI",Arial,sans-serif;padding:0}
#diagram{width:1050px;background:#ffffff}
#diagram svg{display:block;max-width:none;height:auto}
</style>
<script src="./vendor/mermaid.min.js"></script></head>
<body>
<div id="diagram"></div>
<script>
const def = "flowchart LR\n  subgraph Anatomy[\"Устройство модуля\"]\n    R[\"*.routes.js\"] --> C[\"*.controller.js\"]\n    C --> V[\"*.validation.js\"]\n    C --> S[\"*.service.js\"]\n    S --> M[\"*.model.js\"]\n    S --> T[\"sequelize.transaction\"]\n  end\n\n  R --> Registry[\"src/routes/index.js<br/>подключение маршрутов\"]\n  M --> Registry2[\"src/models/index.js<br/>регистрация и ассоциации\"]\n  S --> DB[(\"PostgreSQL<br/>схема задаётся миграциями\")]\n  Registry --> App[\"src/app.js\"]\n  Registry2 --> App\n\n  New[\"Добавление сущности:<br/>1 модель + 1 миграция<br/>1 валидация + 1 сервис<br/>1 контроллер + 1 маршрутизатор<br/>2 строки регистрации\"] -.-> Anatomy\n";
mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict',
  fontFamily: 'Segoe UI, Arial, sans-serif', fontSize: 16,
  flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: false },
  sequence: { useMaxWidth: false, wrap: false },
  er: { useMaxWidth: false, minEntityWidth: 130, entityPadding: 14 } });
(async () => {
  const { svg } = await mermaid.render('diagram-svg', def);
  document.getElementById('diagram').innerHTML = svg;
  window.__rendered = true;
  document.title = 'ready';
})().catch((e) => { document.body.innerHTML = '<pre>' + e.stack + '</pre>'; document.title = 'error'; });
</script></body></html>
